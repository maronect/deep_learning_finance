## Pipeline configuration
## All pipeline parameters are defined here — no hardcoded values in source code.

data:
  tickers: []          # List of B3 tickers, e.g. ["PETR4.SA", "VALE3.SA"]
  start_date: "2010-01-01"
  end_date: "today"     # resolved to datetime.date.today() at pipeline runtime
  frequency: "monthly"  # Options: daily, weekly, monthly

asset_selection:
  method: "stable_corr_pairs"   # Options: sum_abs_correlation, min_max_correlation, lowest_corr_pairs, stable_corr_pairs
  n_assets: 10
  min_data_coverage: 0.85

features:
  lag_window: 24        # Number of past periods used as lag features (t-1 … t-lag_window)
  min_history: 36       # Minimum number of periods required per asset

models:
  enabled: ["ridge", "mlp"]   # Models to train and compare in every run
  blend_alpha: 0.3            # Weight of ML prediction: final_mu = alpha * ml + (1-alpha) * hist
  train_ratio: 0.7            # Fraction of data used for training in walk-forward splits

optimization:
  risk_free_rate: 0.15  # Annual risk-free rate (SELIC 2025)
  frequency: "monthly"  # Frequency for risk-free rate adjustment
  solver: "SLSQP"
  weight_bounds: [0.0, 0.40]  # No short selling; max 40% per asset

evaluation:
  metrics:
    - sharpe_ratio
    - annualized_return
    - annualized_volatility
    - cumulative_return

artifacts:
  base_dir: "artifacts"
  data_dir: "artifacts/data"
  models_dir: "artifacts/models"
  predictions_dir: "artifacts/predictions"
  metrics_dir: "artifacts/metrics"
  weights_dir: "artifacts/weights"
  runs_dir: "artifacts/runs"
