# fly.toml app configuration file generated for dlfinance-api on 2026-04-22T13:40:41Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dlfinance-api'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  PYTHONPATH = '/app'

[[mounts]]
  source = 'dl_artifacts'
  destination = '/app/artifacts'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'
    protocol = 'http'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
