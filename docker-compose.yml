## Docker Compose for local development and deployment
## Usage: docker compose up

version: "3.9"

services:
  api:
    container_name: DLfinance
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./config:/app/config
    environment:
      - ENV=production
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
