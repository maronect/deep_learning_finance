# CI pipeline — runs on every push and pull_request to main/dev.
#
# Jobs (sequential):
#   lint   → ruff code validation
#   test   → smoke tests + unit tests + integration tests
#   docker → Docker image build (push events only)
#   deploy → Fly.io deployment (push to main only)

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:

  # ---------------------------------------------------------------------------
  # 1. Code validation
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install "ruff>=0.4"

      - name: Check style and errors
        run: ruff check src/ tests/

  # ---------------------------------------------------------------------------
  # 2. Tests
  # ---------------------------------------------------------------------------
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime dependencies
        # Use requirements-api.txt (no torch/matplotlib/etc.) to keep CI fast.
        run: pip install -r requirements-api.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Smoke tests
        run: python tests/smoke_test_data_layer.py

      - name: Unit tests
        run: pytest tests/unit/ -v --tb=short

      - name: Integration tests
        run: pytest tests/integration/ -v --tb=short

  # ---------------------------------------------------------------------------
  # 3. Docker image build (push events only — skipped on pull requests)
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: |
            dl-finance:latest
            dl-finance:${{ github.sha }}

  # ---------------------------------------------------------------------------
  # 4. Deploy to Fly.io (push to main only)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy (Fly.io)
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
